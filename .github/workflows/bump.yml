name: Bump CachyOS

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      skip-cooldown:
        description: "Ship releases younger than the 3 day cooldown (urgent security fixes)"
        required: false
        type: boolean
        default: false

concurrency:
  group: bump
  cancel-in-progress: false

defaults:
  run:
    shell: nix shell --inputs-from . nixpkgs#nushell --command nu {0}

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10

      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1
        with:
          extra-conf: |
            extra-substituters = https://cache.creepy.sh/cachyos
            extra-trusted-public-keys = cachyos:cm+GC47yVJ6nd6tIQDx0qlCfWnxyJv3fL/rWr7FDSSg=

      - name: Run update script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_COOLDOWN: ${{ inputs.skip-cooldown || false }}
        run: nu update.nu ...(if $env.SKIP_COOLDOWN == 'true' { [--skip-cooldown] } else { [] })

      - name: Check for changes
        id: diff
        run: |
          let changed = (git diff --quiet versions.json | complete).exit_code != 0
          $"changed=($changed)\n" | save --append $env.GITHUB_OUTPUT
          if $changed { git --no-pager diff versions.json }

      - name: Update flake inputs
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_COOLDOWN: ${{ inputs.skip-cooldown || false }}
        run: |
          nix flake update nixpkgs
          if $env.SKIP_COOLDOWN == 'true' {
            nix flake update cachyos-kernel
          } else {
            let until = (date now) - 3day | date to-timezone UTC | format date '%Y-%m-%dT%H:%M:%SZ'
            let sha = gh api $"repos/CachyOS/linux-cachyos/commits?until=($until)&per_page=1" --jq ".[0].sha"
            print $"cachyos-kernel: newest commit before ($until) is ($sha)"
            nix flake lock --override-input cachyos-kernel $"github:CachyOS/linux-cachyos/($sha)"
          }

      - run: nix flake check
        if: steps.diff.outputs.changed == 'true'

      - uses: ./.github/actions/build-push
        if: steps.diff.outputs.changed == 'true'
        with:
          target: linux-cachyos-latest-znver4-lto
          attic-user: ${{ secrets.ATTIC_USER }}
          attic-endpoint: ${{ secrets.ATTIC_ENDPOINT }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ secrets.ATTIC_CACHE }}

      - name: Commit and push to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          let old = git show HEAD:versions.json | from json
          let new = open versions.json
          let changes = $new | transpose stream v | each {|row|
            let before = $old | get --optional $row.stream | get --optional version
            if $before != $row.v.version { $"($row.stream): ($before | default 'none') -> ($row.v.version)" }
          }
          let message = $"chore: bump kernel \(($changes | str join ', ')\)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json flake.lock
          git commit -m $message
          git push origin HEAD:main
