name: Bump CachyOS

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

defaults:
  run:
    shell: nu {0}

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3.29
        with:
          version: "0.116"

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nu update.nu

      - name: Check for changes
        id: diff
        run: |
          let changed = (git diff --quiet versions.json | complete).exit_code != 0
          $"changed=($changed)\n" | save --append $env.GITHUB_OUTPUT
          if $changed { git --no-pager diff versions.json }

      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1
        if: steps.diff.outputs.changed == 'true'

      - name: Update flake inputs
        if: steps.diff.outputs.changed == 'true'
        run: nix flake update

      - run: nix flake check
        if: steps.diff.outputs.changed == 'true'

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "chore: bump inputs/versions.json"
          title: "Automated kernel version bump"
          body: ""
          branch: "auto/kernel-bump"
          base: "main"
